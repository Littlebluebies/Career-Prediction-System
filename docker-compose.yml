# =============================================================
# docker-compose.yml — Development environment (4 services)
# Sources: IMPLEMENTATION_PLAN §4, ENVIRONMENT_SETUP §23-27,
#          docs/decisions/0001 (service names), 0003 (postgres:17), 0004 (AI internal)
#
# All values come from the root .env (Compose reads it automatically).
# No password is written in this file (DATABASE.md §57, CLAUDE.md §13).
#
# Usage:  docker compose up --build
# =============================================================

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 127.0.0.1 = reachable from this computer only, not from the network
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ = use the variable inside the container, not from .env
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build: ./services/ai
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AI_SERVICE_PORT: 8000
    # Internal service (ADR 0004 §5): published to this computer only
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./apps/api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_PORT: 4000
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      # Service names as hostnames, never localhost (ENVIRONMENT_SETUP §26-27)
      DATABASE_URL: ${DATABASE_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/web
      args:
        # Inlined into the browser bundle at build time (API.md §3)
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  # Keeps database data when containers are recreated.
  # Reset: docker compose down -v (ENVIRONMENT_SETUP §38)
  postgres_data:
