# =============================================================
# ci.yml — Continuous Integration (no CD; deployment is Phase 13)
# Decisions: docs/decisions/0011-continuous-integration.md
#
# Rules (ADR 0011 §6): no external API calls, no real secrets,
# no large model downloads, synthetic fixtures only.
# Logs of this public repository are public.
# =============================================================
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Read-only token: CI only reads the code (ADR 0011 §5)
permissions:
  contents: read

# A new push to the same branch / PR cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ENVIRONMENT_SETUP §46-48: Lint, TypeScript Check, Build
  # (Unit Tests are added when code exists, ADR 0011 §7)
  node:
    name: node (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # api failing must not cancel web: we want to see both results
      fail-fast: false
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      # Same placeholder value as .env.example; web inlines it at build time
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
      # Next.js sends anonymous telemetry by default; CI makes no external calls
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc          # 24 (ADR 0008)
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      # npm ci installs exactly what package-lock.json says and fails if
      # package.json and the lockfile disagree (ADR 0008)
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Reference dataset: Python syntax check (ENVIRONMENT_SETUP §46),
  # quality checks (DATASET_SPEC §32-35) and "the committed seed is up to date"
  # (ADR 0010 §14-15). build_esco_reference.py is NOT run: it needs the raw
  # ESCO download, which is not in Git (ADR 0010 §5).
  dataset:
    name: dataset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"            # ADR 0008 (on Windows: py -3.13)

      # Compiles every .py file without running it; a syntax error fails the job.
      # -x skips a local virtualenv (only exists on a developer machine).
      - name: Python syntax check
        run: python -m compileall -q -x '[\\/]\.venv[\\/]' services/ai scripts/dataset

      - name: Validate processed dataset
        run: python scripts/dataset/validate.py

      # import.py validates again, then rewrites database/seed/reference/*.sql
      - name: Regenerate reference seed
        run: python scripts/dataset/import.py

      # Any modified OR new (untracked) file means someone changed the dataset
      # or import.py without committing the regenerated seed.
      # git diff --exit-code alone would miss new untracked files.
      - name: Committed files must match the regenerated ones
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "::error::Generated files differ from the repository. Run 'py -3.13 scripts/dataset/import.py' and commit the result."
            echo "$changes"
            git --no-pager diff --stat
            exit 1
          fi
          echo "Reference seed is up to date."

  # Fresh database from the migration files (DATABASE_MIGRATION_PLAN §51, §61):
  # migrate -> seed (development and reference) -> SQL tests, on a throw-away
  # career_system_test database created and dropped by test.sh (ADR 0009 §4).
  # reset.sh is not used: it waits for a typed confirmation.
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # On a PR, HEAD is the merge commit; depth 2 also fetches its first
          # parent (the tip of the base branch) for the immutability check below
          fetch-depth: 2

      # DATABASE_MIGRATION_PLAN §7: an applied migration is never edited.
      # A fresh CI database cannot see this (no stored checksum to compare),
      # so compare the PR with its base branch: new files only (ADR 0011 §12).
      - name: Existing migrations are unchanged
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-status --diff-filter=a HEAD^1 HEAD -- 'database/migrations/*.sql')"
          if [ -n "$changed" ]; then
            echo "::error::Existing migration files were modified, deleted or renamed. Add a new NNN_*.sql migration instead (DATABASE_MIGRATION_PLAN §7)."
            echo "$changed"
            exit 1
          fi
          echo "Only new migration files (or none) in this PR."

      # Placeholder values only (change_me); the container lives for this job only
      - name: Create .env from .env.example
        run: cp .env.example .env

      # --wait returns when the postgres healthcheck (pg_isready) passes
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Database tests
        run: bash scripts/database/test.sh

      - name: PostgreSQL logs
        if: failure()
        run: docker compose logs postgres

  # Whole system as in development (ENVIRONMENT_SETUP §39-40, §48-49):
  # build all 4 images (installs requirements.txt = Python dependency check),
  # start them, then ask the backend whether DB and AI service are reachable.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Create .env from .env.example
        run: cp .env.example .env

      # --wait: waits for healthchecks (postgres, ai-service); backend and
      # frontend have no healthcheck, so --wait only waits for them to start
      - name: Build and start all services
        run: docker compose up -d --build --wait

      # /health always answers HTTP 200 (status "degraded" when DB or AI is down),
      # so check data.status in the body, and retry while the backend boots.
      - name: Backend health reports status ok
        run: |
          for i in $(seq 1 30); do
            body="$(curl -sS http://localhost:4000/health || true)"
            if echo "$body" | jq -e '.data.status == "ok"' > /dev/null 2>&1; then
              echo "OK: $body"
              exit 0
            fi
            echo "attempt $i/30 not ready yet: ${body:-no response}"
            sleep 2
          done
          echo "::error::Backend /health did not report status ok within 60 seconds"
          exit 1

      - name: Frontend responds
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000; then
              echo "OK: frontend answered"
              exit 0
            fi
            echo "attempt $i/30 frontend not ready yet"
            sleep 2
          done
          echo "::error::Frontend did not answer within 60 seconds"
          exit 1

      - name: Container status and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs
